name: "Publish Plugin"

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

# One run per release at a time, so a second run cannot replace the
# assets while the first one reads them for the manifest.
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: "9.0.*"
      dotnet-target: "net9.0"
  upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
      - name: Prepare GitHub release assets
        run: |-
          for file in ./*.zip; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l
      - name: Upload GitHub release assets (release)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.9.0
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*
      - name: Upload GitHub release assets (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG=$(gh release view -R ${{ github.repository }} --json tagName -q .tagName)
          gh release upload -R ${{ github.repository }} "$TAG" ./* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  generate:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate the plugin repository
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet --break-system-packages pyyaml
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          python3 scripts/plugin-repository.py generate --tag "$tag"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
