name: "Publish Plugin"

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@master
    with:
      dotnet-version: "9.0.*"
      dotnet-target: "net9.0"
  upload:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: build-artifact
      - name: Prepare GitHub release assets
        run: |-
          for file in ./*.zip; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l
      - name: Upload GitHub release assets (release)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.9.0
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*
      - name: Upload GitHub release assets (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG=$(gh release view -R ${{ github.repository }} --json tagName -q .tagName)
          gh release upload -R ${{ github.repository }} "$TAG" ./* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  generate:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - name: Jellyfin plugin repo
        uses: Kevinjil/jellyfin-plugin-repo-action@v0.4.3
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
